# Все настройки системы вынесены сюда (требование раздела 6.6 ТЗ).
# Пороги ниже - стартовые значения; их нужно подбирать на своих данных
# (5+ человек, 2 условия освещения, 10+ видео чистки зубов).

camera:
  index: 0              # индекс веб-камеры (0 = встроенная, 1 = USB)
  width: 640            # ширина кадра после нормализации размера
  height: 480
  mirror: true          # зеркальное отражение по горизонтали

presence:
  activation_debounce_sec: 0.3  # лицо должно быть в кадре столько секунд, чтобы считаться появившимся
  lost_grace_sec: 1.0           # лицо отсутствует дольше этого времени -> face_lost
  idle_timeout_sec: 15          # ФТ-2: возврат в режим ожидания (по умолчанию 15 с)

identification:
  cosine_threshold: 0.40    # SFace: сходство >= порога -> тот же человек (рекомендация OpenCV 0.363)
  vote_window: 10           # решение по большинству из N кадров
  vectors_per_profile: 8    # 5-10 векторов на профиль (хранятся только векторы, не фото)
  enroll_interval_sec: 0.5  # пауза между снимками при регистрации профиля
  detector_score: 0.8       # порог уверенности детектора лица YuNet

gestures:
  hold_ms: 400              # удержание статичного жеста 300-500 мс
  cooldown_ms: 1000         # пауза после срабатывания
  max_move_while_holding: 0.08   # статичный жест сбрасывается, если рука сместилась сильнее (доли кадра)
  swipe_window_ms: 600      # за это время рука должна пройти путь свайпа
  swipe_min_dx: 0.28        # минимальный горизонтальный путь свайпа (доли ширины кадра)
  swipe_max_dy_ratio: 0.6   # вертикальное смещение не больше этой доли от горизонтального
  finger_extended_ratio: 1.15   # палец выпрямлен, если кончик дальше от запястья, чем сустав, в столько раз

brushing:
  total_sec: 120            # 2 минуты
  quadrant_sec: 30          # 4 квадранта по 30 с
  pause_after_still_sec: 5  # ФТ-7: пауза при остановке движения > 5 с
  mouth_distance_ratio: 0.7   # рука "у рта": расстояние до центра рта <= доли ширины лица
  motion_window_sec: 1.0    # окно, по которому оценивается движение руки
  min_motion_extent: 0.05   # размах движения за окно (в ширинах лица); меньше - это дрожание точек, а не чистка
  min_oscillation_ratio: 1.5   # путь / размах: у чистки (туда-сюда) заметно больше 1, у плавного перемещения руки около 1
  side_dead_zone: 0.15      # зона неопределённости по горизонтали (ширины лица)
  hand_below_means_upper: true   # гипотеза: рука ниже линии рта -> чистятся верхние зубы (проверить на видео)
  strict_zone: false        # true: время засчитывается только если определённая сторона совпала с заданной

ui:
  width: 960                # размер окна приложения (пропорции 16:9)
  height: 540
  font_path: ""             # путь к .ttf с кириллицей; пусто = подобрать системный шрифт
  background_dim: 0.35      # яркость камеры на заднем плане (0..1)
  summary_timeout_sec: 15   # через сколько секунд итог чистки закрывается сам

weather:
  latitude: 51.17           # Астана
  longitude: 71.43
  refresh_min: 15
  city: Астана

schedule:
  path: data/schedule.json

storage:
  db_path: data/mirror.db
